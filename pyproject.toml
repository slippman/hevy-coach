[project]
name = "hevy-coach"
version = "0.2.0"
description = "Turn Hevy CSV exports into practical next-workout recommendations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hevy Coach contributors" }]
dependencies = ["click>=8.1", "questionary>=2.1"]

[project.scripts]
hevy-coach = "hevy_coach.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=6.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["hevy_coach"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
