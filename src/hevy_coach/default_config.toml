[defaults.global]
sets = 3
min_reps = 8
max_reps = 10
increment_lbs = 5

[defaults.categories.compound]
min_reps = 6
max_reps = 10

[defaults.categories.isolation]
min_reps = 8
max_reps = 10

[defaults.categories.core]
min_reps = 8
max_reps = 12

[routines]
names = ["Strength A", "Strength B", "Bodyweight Circuit"]

[workouts."Strength A"]
display_name = "Strength A"
exercise_order = ["Bench Press (Dumbbell)", "Seated Cable Row - V Grip (Cable)", "Shoulder Press (Machine Plates)", "Cable Fly Crossovers", "Lateral Raise (Dumbbell)", "Bicep Curl (Dumbbell)", "Triceps Pushdown", "Crunch (Machine)"]
warmup_set_counts = { "Bench Press (Dumbbell)" = 1, "Seated Cable Row - V Grip (Cable)" = 1, "Shoulder Press (Machine Plates)" = 1 }

[workouts."Strength B"]
display_name = "Strength B"
exercise_order = ["Incline Bench Press (Dumbbell)", "Lat Pulldown", "Rear Delt Reverse Fly (Machine)", "Hammer Curl (Dumbbell)", "Skullcrusher (Dumbbell)", "Crunch (Machine)", "Back Extension (Machine)"]
warmup_set_counts = { "Incline Bench Press (Dumbbell)" = 1, "Lat Pulldown" = 1 }

[workouts."Bodyweight Circuit"]
display_name = "Bodyweight Circuit"
exercise_order = ["Push Up", "Pull Up", "Plank"]
supersets = [{ exercises = ["Push Up", "Pull Up"], rest_seconds = [90, 120] }]

[exercises."Bench Press (Dumbbell)"]
display_name = "Bench Press"
aliases = ["DB Bench", "Dumbbell Bench Press", "Bench Press (Dumbbell)"]
category = "compound"
increment_lbs = 5

[exercises."Seated Cable Row - V Grip (Cable)"]
display_name = "Seated Cable Row"
aliases = ["Cable Row V Grip", "Seated Cable Row", "Seated Cable Row - Bar Grip"]
category = "compound"
min_reps = 8
increment_lbs = 10
sets = 4

[exercises."Shoulder Press (Machine Plates)"]
display_name = "Shoulder Press"
aliases = ["Machine Shoulder Press", "Shoulder Press Machine"]
category = "compound"
increment_lbs = 5

[exercises."Incline Bench Press (Dumbbell)"]
display_name = "Incline DB Bench"
aliases = ["Incline DB Bench", "Incline Bench Press (Dumbbell)"]
category = "compound"

[exercises."Lat Pulldown"]
display_name = "Lat Pulldown"
aliases = ["Lat Pulldown (Cable)", "Lat Pulldown"]
category = "compound"
min_reps = 8
increment_lbs = 10

[exercises."Cable Fly Crossovers"]
display_name = "Cable Fly"
aliases = ["Cable Fly", "Cable Crossover"]
category = "isolation"

[exercises."Lateral Raise (Dumbbell)"]
display_name = "Lateral Raise"
aliases = ["Lateral Raise", "Dumbbell Lateral Raise"]
category = "isolation"
min_reps = 8
max_reps = 10
large_increment = true

[exercises."Bicep Curl (Dumbbell)"]
display_name = "DB Curl"
aliases = ["DB Curl", "Dumbbell Curl", "Alternating Dumbbell Curl"]
category = "isolation"

[exercises."Triceps Pushdown"]
display_name = "Triceps Pushdown"
aliases = ["Tricep Pushdown", "Cable Triceps Pushdown", "Triceps Rope Pushdown"]
category = "isolation"

[exercises."Rear Delt Reverse Fly (Machine)"]
display_name = "Rear Delt Fly"
aliases = ["Rear Delt Reverse Fly (Machine)", "Rear Delt Fly"]
category = "isolation"

[exercises."Hammer Curl (Dumbbell)"]
display_name = "Hammer Curl"
aliases = ["Hammer Curl (Dumbbell)", "Hammer Curl"]
category = "isolation"

[exercises."Skullcrusher (Dumbbell)"]
display_name = "DB Skullcrusher"
aliases = ["Skullcrusher (Dumbbell)", "Dumbbell Skullcrusher"]
category = "isolation"

[exercises."Crunch (Machine)"]
display_name = "Crunch Machine"
aliases = ["Ab Crunch Machine", "Machine Crunch", "Abdominal Crunch Machine"]
category = "core"
increment_lbs = 10
starting_weight = 90

[exercises."Back Extension (Machine)"]
display_name = "Back Extension"
aliases = ["Back Extension (Machine)", "Back Extension"]
category = "core"
increment_lbs = 10

[exercises."Push Up"]
display_name = "Push-Up"
aliases = ["Push-Up"]
category = "compound"
sets = 3
min_reps = 8
max_reps = 15
progression = "bodyweight_reps"

[exercises."Pull Up"]
display_name = "Pull-Up"
aliases = ["Pull-Up"]
category = "compound"
sets = 3
min_reps = 1
max_reps = 8
progression = "bodyweight_reps"

[exercises."Plank"]
display_name = "Plank"
category = "core"
sets = 3
progression = "duration"
min_seconds = 45
max_seconds = 60
increment_seconds = 5
